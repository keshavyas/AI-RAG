services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_platform_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ai_platform
      POSTGRES_PASSWORD: ai_platform_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: ai_platform_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: ai_platform_seaweedfs
    restart: unless-stopped

    command: server -s3 -s3.port=9000 -dir=/data

    ports:
      - "9000:9000"
      - "9333:9333"

    volumes:
      - seaweed_data:/data


volumes:
  postgres_data:
  redis_data:
  seaweed_data: